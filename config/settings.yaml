portfolio:
  max_daily_turnover_pct: 0.30
  # 规则策略 BUY 全局门槛（trend/mean_reversion 等，confidence 尺度约 0.84）
  min_rebalance_buy_confidence: 0.75
  min_rebalance_buy_rank_score: 0.50
  # alpha158 生产模型 BUY 专属门槛（confidence 为排名分位型分数，尺度约 0.67）
  min_baseline_buy_confidence: 0.55
  min_baseline_buy_rank_score: 0.30
  signal_arbiter:
    enabled: true
    consensus_baselines:
      - alpha158
    max_prediction_stale_days: 3
    max_rule_buy_rank: 500
    min_rule_buy_confidence: 0.45
    block_when_missing: true
    # R3: 财报 sentiment 注入 priority_score 调整 + decision_reason 可审计
    # 首版只调分不拒(buy_negative_block=false),3-6 月后看效果再切 true
    earnings_modifier:
      enabled: true
      buy_negative_block: false
      weight: 0.15
      lookback_days: 60   # 一个季报披露周期约 60 天,跨季可调更长
  regime_policy:
    enabled: false
    benchmark_index: "000300"
    lookback_days: 260
    fast_window: 20
    slow_window: 120
    vol_window: 20
    drawdown_window: 120
  allocation:
    enabled: true
    core_target_pct: 0.50
    satellite_target_pct: 0.45
    cash_target_pct: 0.05
    rebalance_tolerance_pct: 0.05
    min_trade_amount: 1000
    core_cash_priority: true
  exposure:
    enabled: true
    benchmark_index: "000300"
    max_industry_weight_warn: 0.30
    max_position_weight_warn: 0.15
    max_top5_weight_warn: 0.70
    max_unknown_industry_weight_warn: 0.05
    min_pe_coverage: 0.80
    min_pb_coverage: 0.80
