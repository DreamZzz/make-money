index_funds:
  enabled: true
  watchlist:
    # 已获利清仓,仅保留小额仓位作回访,不进 M4 主动管理
    - fund_code: "004192"
      name: "招商中证500指数增强A"
      fund_type: "OPEN"
      tracking_index: "000905"
      tracking_index_name: "中证500"
      market: "CN"
      currency: "CNY"
      target_weight: 0.0
      enabled: true
      category: "equity_index"
      intent: "exited"

    - fund_code: "013308"
      name: "易方达恒生科技ETF联接(QDII)A"
      fund_type: "OPEN"
      tracking_index: "HSTECH"
      tracking_index_name: "恒生科技"
      market: "CN"
      currency: "CNY"
      target_weight: 0.33
      enabled: true
      category: "qdii"
      intent: "active"

    # 股债混合基金,不适用纯权益指数评估;tracking_index 仅作参考
    - fund_code: "012963"
      name: "招商稳健平衡混合A"
      fund_type: "OPEN"
      tracking_index: "000300"
      tracking_index_name: "沪深300(仅参考)"
      market: "CN"
      currency: "CNY"
      target_weight: 0.0
      enabled: true
      category: "balanced"
      intent: "active"

portfolio:
  max_daily_turnover_pct: 0.30
  # 规则策略 BUY 全局门槛（trend/mean_reversion 等，confidence 尺度约 0.84）
  min_rebalance_buy_confidence: 0.75
  min_rebalance_buy_rank_score: 0.50
  # alpha158 生产模型 BUY 专属门槛（confidence 为排名分位型分数，尺度约 0.67）
  min_baseline_buy_confidence: 0.55
  min_baseline_buy_rank_score: 0.30
  signal_arbiter:
    enabled: true
    consensus_baselines:
      - alpha158
    max_prediction_stale_days: 3
    max_rule_buy_rank: 500
    min_rule_buy_confidence: 0.45
    block_when_missing: true
  regime_policy:
    enabled: false
    benchmark_index: "000300"
    lookback_days: 260
    fast_window: 20
    slow_window: 120
    vol_window: 20
    drawdown_window: 120
  allocation:
    enabled: true
    core_target_pct: 0.50
    satellite_target_pct: 0.45
    cash_target_pct: 0.05
    rebalance_tolerance_pct: 0.05
    min_trade_amount: 1000
    core_cash_priority: true
  exposure:
    enabled: true
    benchmark_index: "000300"
    max_industry_weight_warn: 0.30
    max_position_weight_warn: 0.15
    max_top5_weight_warn: 0.70
    max_unknown_industry_weight_warn: 0.05
    min_pe_coverage: 0.80
    min_pb_coverage: 0.80
