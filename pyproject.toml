[project]
name = "make-money"
version = "0.1.0"
description = "个人量化评估系统 — A股+港股 日频/周频调仓"
requires-python = ">=3.12"
dependencies = [
    # 数据采集
    "akshare>=1.16.0",
    "baostock>=0.9.1",
    "yfinance>=0.2.50",
    # 数据处理
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "duckdb>=1.1.0",
    "duckdb-engine>=0.14.0",
    "pyarrow>=18.0.0",
    # 量化研究
    "pyqlib>=0.9.6",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    # 回测
    "vectorbt>=0.7.0",
    # 组合优化
    "PyPortfolioOpt>=1.5.6",
    # 可视化
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    # 工具
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
data-extra = [
    "mootdx>=0.11.7",
]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# Baseline debt to clean incrementally: script-style sys.path bootstraps and long dashboard/UI strings.
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# Existing local edits in this file keep Python 3.9-style Optional annotations; clean once that work is reconciled.
"src/dashboard/job_manager.py" = ["UP045"]
# Runtime compatibility shim for accidental Python 3.9 execution on macOS system Python.
"src/data_pipeline/main.py" = ["UP036"]
