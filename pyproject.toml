[project]
name = "make-money"
version = "0.1.0"
description = "个人量化评估系统 — A股+港股 日频/周频调仓"
requires-python = ">=3.12"
dependencies = [
    # 数据采集
    "akshare>=1.16.0",
    "yfinance>=0.2.50",
    # 数据处理
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "duckdb>=1.1.0",
    "duckdb-engine>=0.14.0",
    "pyarrow>=18.0.0",
    # 量化研究
    "pyqlib>=0.9.6",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    # 回测
    "vectorbt>=0.7.0",
    # 组合优化
    "PyPortfolioOpt>=1.5.6",
    # 可视化
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
    # 工具
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
